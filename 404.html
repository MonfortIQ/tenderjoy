<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 – Coconut Dropped | Page Not Found | TenderJoy</title>
  <meta name="description" content="Oops! Looks like this coconut fell off the palm. The page you are looking for does not exist.">
  
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="d-flex flex-column min-vh-100 justify-content-between">

  <!-- Header -->
  <header class="tj-header">
    <div class="container py-2 d-flex justify-content-between align-items-center">
      <a class="navbar-brand tj-logo" href="index.html">
        <img src="assets/images/logo.svg" alt="TenderJoy" class="site-logo-img" data-logo-light="assets/images/logo.svg" data-logo-dark="assets/images/logo-light.svg">
      </a>
      <div class="d-flex align-items-center gap-2">
        <button class="btn-ctrl btn-ctrl-rtl rtl-toggle-btn"><span class="dir-label">RTL</span></button>
        <button class="btn-ctrl theme-toggle-btn"><i class="bi bi-moon-stars-fill"></i></button>
      </div>
    </div>
  </header>

  <!-- 404 Main Section -->
  <main class="container my-auto py-5 text-center tj-special-hero" style="background-image: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1600&q=90');">
    <div class="row justify-content-center">
      <div class="col-lg-7">
        
        <!-- Tropical Error Graphic -->
        <div class="mb-4">
          <svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 100 100" fill="none">
            <!-- Palm Frond Drooping -->
            <path d="M50 15C30 15 15 35 15 55" stroke="#45A85A" stroke-width="6" stroke-linecap="round"/>
            <path d="M25 28C20 38 18 45 15 55" stroke="#B8D94B" stroke-width="4" stroke-linecap="round"/>
            <!-- Cracked Coconut -->
            <circle cx="50" cy="65" r="24" fill="#145C38"/>
            <circle cx="50" cy="65" r="18" fill="#FFF9EC"/>
            <!-- Crack Zigzag -->
            <path d="M50 48L47 56L53 64L48 72L50 82" stroke="#145C38" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            <!-- Splash drops -->
            <circle cx="32" cy="50" r="3" fill="#45A85A"/>
            <circle cx="70" cy="52" r="3.5" fill="#45A85A"/>
            <circle cx="64" cy="78" r="2.5" fill="#B8D94B"/>
          </svg>
        </div>

        <span class="badge-tag badge-accent mb-3">Error 404 &bull; Lost in the Grove</span>
        <h1 class="display-3 fw-bold mb-3 text-tj-primary">Looks Like This Coconut Fell Off!</h1>
        <p class="lead text-tj-muted mb-4">
          We couldn’t find the page you were looking for. It might have been harvested, moved to another grove, or drank down to the last drop.
        </p>

        <div class="d-flex justify-content-center flex-wrap gap-3">
          <a href="index.html" class="btn-tj btn-tj-primary btn-tj-lg">
            <i class="bi bi-house-door-fill"></i>
            <span>Return to Homepage</span>
          </a>
          <a href="menu.html" class="btn-tj btn-tj-outline btn-tj-lg">
            <i class="bi bi-cup-straw"></i>
            <span>Explore Fresh Menu</span>
          </a>
        </div>
      </div>
    </div>
  </main>

  <!-- Clean Footer Bar -->
  <footer class="py-3 border-top text-center text-tj-muted small">
    <div class="container">
      &copy; 2026 <strong>TenderJoy Beverages</strong>. Nature's Freshness in Every Sip.
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
